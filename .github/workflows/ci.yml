# Lo que comprueba el repo cuando sale de la máquina de quien lo escribe.
#
# Tres jobs a propósito, en paralelo: `verify` es el bucle rápido (la suite
# entera, que ninguna sesión corre en local desde el 25-10-2026, más `build` y el
# banco), `lento` la orden lenta y `qa` la única prueba del circuito entero del
# agente. `qa` no está dentro de `pnpm verify` porque abría los puertos fijos
# 9880/9881 y salía 1 con EADDRINUSE si había un `pnpm partida` levantado, que es
# la forma documentada de jugar con el agente. Aquí no hay ese problema — cada
# job es una máquina propia.
#
# `lento` va en su máquina desde el 07-11-2026: con `verify` en la misma, los dos
# pasaban del tope de 10 minutos (el 13-10-2026 ya tardaban 9 min 56 s; el
# 06-11-2026 `verify` tardó 5 min y la orden lenta se cortó a los 4): del
# 17-10-2026 al 26-10-2026, 16 CI de main salieron cancelados a media orden
# lenta, con `verify` ya en verde.
#
# NO SE GASTA UN CÉNTIMO: no se llama a ningún servicio de pago ni se declara
# ninguna credencial. `permissions` es de solo lectura para que tampoco pueda
# escribir en el repo. La comprobación es un grep
# de las palabras que delatarían lo contrario, y este fichero está escrito para
# no contener ninguna.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Dos pushes seguidos a la misma rama no tienen por qué correr los dos hasta el
# final: manda el último. En un PR no se cancela nada que nadie vaya a mirar,
# porque lo que se mira es la cabeza de la rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Quince minutos, el doble de lo que tarda (06-11-2026: 1 min de checkout y
    # 5 de `pnpm verify`; el build y el banco, segundos).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # La versión de pnpm sale de `packageManager` en package.json: una sola
      # fuente, la misma que usa quien desarrolla.
      - uses: pnpm/action-setup@v4
      # La versión de Node sale de `.node-version`, exacta y no `24` (#163): la
      # tabla Unicode cambia entre menores (v24.11.1 trae Unicode 16; v24.14,
      # 17) y `lineaLegible` (src/core/linea.ts) la lee en `\p{M}` y
      # `\p{Cf}`. Con `24` a secas, el mismo commit podía pasar hoy y fallar
      # mañana sin tocar nada. Es también el suelo de `engines`: CI prueba la
      # más vieja que se soporta. En local corre la que haya (hoy 26.10, con
      # Unicode 17.0 igual que la 24.21.0): no pasa nada, pero si un test de
      # nombres sale distinto aquí y allí, esta es la primera sospechosa.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` y no sus tres órdenes sueltas: el bucle rápido se define
      # UNA vez, en package.json, y así añadirle una comprobación llega también
      # aquí. Se pierde la anotación por paso en la interfaz de Actions —un
      # rojo dice «verify» y hay que abrir el log para ver si fue tsc, biome o
      # vitest—; sale más barato que dos definiciones que se separan solas.
      - run: pnpm verify
      # `vite build` a secas, no `pnpm build`: ese encadena un `tsc -b --noEmit`
      # que NO es incremental y repite el typecheck que acaba de hacer `verify`.
      - run: npx vite build
      # El banco no entra en `pnpm verify` —4,3 s es demasiado para el bucle
      # rápido— pero su sha256 es lo ÚNICO que caza un cambio de partidas que
      # los tests dan por bueno, así que su sitio es aquí. Sale 1 si el volcado
      # de las 20 partidas no coincide con el sha anclado en `banco.ts`.
      #
      # Es reproducible en otra máquina porque el núcleo no usa una sola
      # operación de coma flotante dependiente de la plataforma: mulberry32 va
      # con `Math.imul` sobre enteros, y de `Math` solo se llama a min, max,
      # floor, ceil, abs, round e imul — todas exactas por especificación. Ni
      # `Math.pow`, ni trigonometría, ni `Intl`.
      - run: pnpm banco

  lento:
    runs-on: ubuntu-latest
    # Treinta minutos, casi el doble de lo que tarda (07-11-2026: 14 min 12 s la
    # orden y 16 min el job).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # La orden lenta (#167): los mismos tests con todas las semillas y todo el
      # arte vuelto a derivar, que en el bucle rápido van con una muestra
      # (`test/lento.ts`). Solo los tests: el typecheck y Biome los pasa
      # `verify`. Va además de él y no en su lugar porque algunos tests
      # comprueban cifras distintas con la muestra que con todas.
      - run: pnpm test:lento

  qa:
    runs-on: ubuntu-latest
    # Cinco minutos es diez veces lo que tarda hoy (5,4 s). El tope está por si
    # el arnés se queda esperando una petición que no llega: sin él, un bloqueo
    # se come el presupuesto entero de Actions en vez de salir rojo.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa
