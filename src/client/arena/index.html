<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heroes of Silence — arena</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./arena.css" />
  </head>
  <body>
    <div id="app" data-escena="montaje">
      <header id="topbar">
        <span class="marca">ARENA</span>
        <span id="day">Montaje</span>
        <span id="turn"></span>
        <span id="seed"></span>
        <span id="acciones-arena">
          <button data-arena="luchar" class="primary">Luchar</button>
          <button data-arena="enlace" title="Copia una dirección que monta esta misma pelea: unidades, cifras, héroes, quién mueve, semilla y reglas">Copiar enlace de la pelea</button>
          <button data-arena="ir-a-edicion" title="Abre las fichas de las unidades que quieras, en columnas; las que no caben van debajo">Editar fichas</button>
          <button data-arena="guardar">Guardar</button>
          <button data-arena="volver-de-edicion" class="primary">Volver al montaje</button>
        </span>
      </header>

      <main id="montaje">
        <section id="catalogo"></section>
        <section id="bando-izquierda"></section>
        <section id="ficha"></section>
        <section id="bando-derecha"></section>
        <section id="muralla"></section>
      </main>

      <main id="edicion"></main>

      <main id="stage">
        <div id="lienzo" class="map-wrap"><canvas id="canvas" tabindex="0"></canvas></div>
        <aside id="lateral"><div id="side"></div></aside>
      </main>

      <dialog id="editor-en-combate" aria-labelledby="titulo-del-editor">
        <header class="cabecera-del-editor">
          <h2 id="titulo-del-editor">Editar en plena pelea</h2>
          <button data-arena="cerrar-editor" class="primary">Volver a la pelea</button>
        </header>
        <p id="aviso-del-editor" class="aviso-del-editor" role="status"></p>
        <div id="ficha-del-editor"></div>
      </dialog>

      <footer id="statusbar">
        <span id="status">Cargando las hojas…</span>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
